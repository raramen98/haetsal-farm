# Render Blueprint — 백엔드(NestJS) + PostgreSQL
# 비밀값(OPENAI_API_KEY, SEED_PASSWORD, CORS_ORIGIN)은 Render 대시보드에서 입력 (sync: false)
databases:
  - name: haetsal-db
    plan: free
    region: singapore
    databaseName: haetsal
services:
  - type: web
    name: haetsal-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: haetsal-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: TZ
        value: Asia/Seoul
      - key: NODE_VERSION
        value: 20.18.1
      - key: OPENAI_API_KEY
        sync: false
      - key: SEED_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        sync: false
